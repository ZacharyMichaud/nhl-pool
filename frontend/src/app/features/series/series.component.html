<div class="page-container">
  <!-- Round selector dropdown -->
  <div class="round-dropdown-row">
    <app-dropdown
      id="series-round-select"
      [options]="roundDropdownOptions"
      [value]="selectedRound()"
      (valueChange)="selectRound($event)"
      placeholder="Select round…">
    </app-dropdown>
  </div>

  <!-- Series card list -->
  <div class="series-grid" *ngIf="series().length > 0; else noSeries">
    <app-series-card-list
      [series]="series()"
      [seriesGames]="seriesGames()"
      [predictionDraft]="predictionDraft()"
      [allTeams]="allTeams()"
      [allTeamPredictions]="allTeamPredictions()"
      [predScoringRules]="predScoringRules()"
      [selectedRound]="selectedRound()"
      (winnerChange)="onWinnerChange($event)"
      (gamesChange)="onGamesChange($event)">
    </app-series-card-list>
  </div>

  <ng-template #noSeries>
    <div class="card empty-state">
      <span class="empty-icon">📅</span>
      <p>No series data for this round yet.</p>
      <p class="empty-sub">Ask an admin to sync the bracket.</p>
    </div>
  </ng-template>

  <!-- Save bar — only when unsaved changes exist -->
  <div class="save-bar" *ngIf="hasDirtyPredictions">
    <button class="btn-save"
      id="series-save-btn"
      (click)="saveAll()"
      [disabled]="saving()">
      <span *ngIf="saving()">⏳ Saving…</span>
      <span *ngIf="!saving()">💾 Save Predictions</span>
    </button>
  </div>

</div><!-- end page-container -->
